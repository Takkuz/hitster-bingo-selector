<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Hitster Bingo – Categoria casuale</title>
  <meta name="theme-color" content="#f4f1fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#120f1d" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f4f1fb, #120f1d);
      --card: light-dark(#ffffff, #1f1a30);
      --text: light-dark(#1b1530, #f1eefc);
      --muted: light-dark(#5d5675, #b3abcc);
      --accent: #c13cff;
      font-family: system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      padding: 1rem;
    }
    main {
      width: min(100%, 32rem);
      background: var(--card);
      border-radius: 1.25rem;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgb(0 0 0 / .15);
      text-align: center;
    }
    h1 { margin: 0 0 1rem; font-size: 1.6rem; text-wrap: balance; }
    fieldset { border: 0; margin: 0 0 1.25rem; padding: 0; }
    legend { margin-inline: auto; margin-bottom: .5rem; color: var(--muted); }
    .modes { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
    .modes label {
      display: block;
      padding: .75rem;
      border: 2px solid color-mix(in srgb, var(--accent) 40%, transparent);
      border-radius: .75rem;
      cursor: pointer;
      font-weight: 600;
    }
    .modes label small { display: block; font-weight: 400; color: var(--muted); }
    .modes input { position: absolute; opacity: 0; pointer-events: none; }
    .modes label:has(input:checked) {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .modes label:has(input:checked) small { color: #fff; }
    .modes label:has(input:focus-visible) { outline: 3px solid var(--text); outline-offset: 2px; }
    button {
      font: inherit;
      font-weight: 700;
      font-size: 1.5rem;
      width: 100%;
      padding: 1.25rem 2rem;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    /* Mobile browsers draw a rectangular tap overlay that ignores border-radius */
    button, .modes label { -webkit-tap-highlight-color: transparent; }
    button { touch-action: manipulation; transition: scale .1s; }
    button:hover { filter: brightness(1.1); }
    button:active:not([aria-disabled="true"]) { scale: .97; filter: brightness(.9); }
    button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
    button[aria-disabled="true"] { opacity: .6; cursor: progress; }
    #result {
      margin-top: 1.5rem;
      min-height: 17rem;
      border-radius: 1rem;
      padding: 1rem;
      /* Matches the dark background of the neon icons */
      background: #000e17;
      color: #e8f1f5;
      border: 2px solid var(--cat-color);
      box-shadow: 0 0 18px color-mix(in srgb, var(--cat-color) 60%, transparent);
      transition: border-color .15s, box-shadow .15s;
    }
    #result:empty { background: transparent; border-color: transparent; box-shadow: none; }
    #result img { display: block; width: 9rem; height: auto; aspect-ratio: 240 / 216; margin: 0 auto .25rem; }
    #result h2 {
      margin: 0 0 .5rem;
      font-size: 1.8rem;
      color: var(--cat-color);
      text-shadow: 0 0 10px color-mix(in srgb, var(--cat-color) 70%, transparent);
    }
    #result p { margin: 0; text-wrap: pretty; }
    #result.spinning p { visibility: hidden; }
    footer { margin-top: 1rem; font-size: .8rem; color: var(--muted); }
    footer a { color: inherit; }
    #install {
      width: auto;
      margin-top: .75rem;
      padding: .5rem 1rem;
      font-size: .9rem;
      background: transparent;
      color: var(--text);
      border: 2px solid var(--accent);
    }
    @media (prefers-reduced-motion: reduce) {
      #result, button { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>🪩 Hitster Bingo</h1>

    <fieldset>
      <legend>Scegli la modalità</legend>
      <div class="modes">
        <label><input type="radio" name="mode" value="A" checked> Principianti <small>Lato A</small></label>
        <label><input type="radio" name="mode" value="B"> Esperti <small>Lato B</small></label>
      </div>
    </fieldset>

    <button type="button" id="spin">Gira la Disco Ball</button>

    <div id="result" aria-live="polite" aria-atomic="true"></div>

    <footer>
      Categorie tratte dal <a href="https://hitstergame.com/it-it/pages/regole-del-gioco-bingo" target="_blank" rel="noopener">regolamento ufficiale</a>.
      <br>
      <button type="button" id="install" hidden>📲 Installa app</button>
    </footer>
  </main>

    };

    const CATEGORIES = {
      A: [
        { name: 'Solista?', icon: 'solo-group', color: '#4ade45', desc: 'Scrivi se la canzone è interpretata da un solista o da più artisti (band, duo, featuring…).' },
        { name: 'Prima del 2000?', icon: 'before-after', color: '#f05cc4', desc: 'Scrivi “Sì” se la canzone è stata pubblicata prima del 2000, “No” se dopo.' },
        { name: '4 anni prima o dopo', icon: '4-years', color: '#ede42e', desc: 'Scrivi l’anno di pubblicazione: è corretto se entro ±4 anni. Anno esatto: cancella una X dalla Lavagnetta di un avversario.' },
        { name: 'Decade', icon: 'decade', color: '#b46cf0', desc: 'Scrivi la decade di uscita della canzone (es. “Anni ’60” o “’60”).' },
        { name: '2 anni prima o dopo', icon: '2-years', color: '#38c4ef', desc: 'Scrivi l’anno di pubblicazione: è corretto se entro ±2 anni. Anno esatto: cancella una X dalla Lavagnetta di un avversario.' },
      ],
      B: [
        { name: 'Titolo', icon: 'title', color: '#4ade45', desc: 'Scrivi il titolo esatto della canzone. Se non è perfetto, decidono gli altri giocatori.' },
        { name: 'Anno esatto', icon: 'year', color: '#f05cc4', desc: 'Scrivi l’anno esatto di pubblicazione della canzone.' },
        { name: 'Nome dell’artista', icon: 'artist', color: '#ede42e', desc: 'Scrivi il nome dell’artista. Nelle collaborazioni basta l’artista principale.' },
        { name: 'Decade', icon: 'decade', color: '#b46cf0', desc: 'Scrivi la decade di uscita della canzone (es. “Anni ’60” o “’60”).' },
        { name: '3 anni prima o dopo', icon: '3-years', color: '#38c4ef', desc: 'Scrivi l’anno di pubblicazione: è corretto se entro ±3 anni.' },
      ],
    };

    const button = document.getElementById('spin');
    const result = document.getElementById('result');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

    function randomIndex(max) {
      const buf = new Uint32Array(1);
      crypto.getRandomValues(buf);
      return buf[0] % max;
    }

    function show(cat) {
      result.style.setProperty('--cat-color', cat.color);
      result.innerHTML = '';
      const img = document.createElement('img');
      img.src = ICONS[cat.icon];
      img.alt = '';
      img.width = 240;
      img.height = 216;
      const h = document.createElement('h2');
      h.textContent = cat.name;
      const p = document.createElement('p');
      p.textContent = cat.desc;
      result.append(img, h, p);
    }

    function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

    button.addEventListener('click', async () => {
      // aria-disabled instead of disabled: disabling would drop focus from the button
      if (button.getAttribute('aria-disabled') === 'true') return;
      const mode = document.querySelector('input[name="mode"]:checked').value;
      const list = CATEGORIES[mode];
      const chosen = list[randomIndex(list.length)];

      if (!reduceMotion.matches) {
        button.setAttribute('aria-disabled', 'true');
        result.setAttribute('aria-busy', 'true');
        result.classList.add('spinning');
        for (let i = 0, delay = 60; i < 12; i++, delay += 15) {
          show(list[(i + randomIndex(list.length)) % list.length]);
          await wait(delay);
        }
        result.classList.remove('spinning');
        result.removeAttribute('aria-busy');
        button.removeAttribute('aria-disabled');
      }
      show(chosen);
    });

    document.querySelectorAll('input[name="mode"]').forEach(r =>
      r.addEventListener('change', () => { result.innerHTML = ''; })
    );

    // Service workers only run over http(s); skip when opened as a local file.
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW non registrato', err));
    }

    // Chromium-only install prompt; other browsers use their own "Add to Home Screen" menu.
    const installBtn = document.getElementById('install');
    let installPrompt = null;
    addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      installPrompt = e;
      installBtn.hidden = false;
    });
    installBtn.addEventListener('click', async () => {
      if (!installPrompt) return;
      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null;
      installBtn.hidden = true;
    });
    addEventListener('appinstalled', () => { installBtn.hidden = true; });
  </script>
